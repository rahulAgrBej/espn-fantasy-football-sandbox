name: report

# Renders one of docs/report-weekly-schedule.md's reports from data already
# on disk and commits the result to reports/, mirroring it to S3 as well.
# Every day in espn_ff/cli.py's REPORTS is implemented -- the workflow
# forwards whatever `day` AWS sends and lets cmd_report's own "not
# implemented" guard handle the rest, so a future report day needs no new
# workflow file, just a wider `options:` list below plus a new schedule.
#
# Unlike every other workflow here, this one writes back to the repo, not
# just to S3 -- reports/<season>/week-NN/ is git-tracked and this job needs
# contents: write to commit its own output.
#
# The same run also writes reports-json/<season>/week-NN/, the structured
# twin of each report (docs/report-json.md). That tree is gitignored and
# S3-only: it is NOT committed, and it is pushed append-only rather than
# mirrored, because a runner's copy holds only the report this run rendered.
# The two mirror steps at the bottom are therefore deliberately asymmetric --
# see scripts/s3_sync.sh's comments on cmd_sync_reports vs
# cmd_sync_reports_json.
#
# The clock lives in AWS. EventBridge Scheduler dispatches:
#
#   report-monday           Mon 10:30 ET
#   report-tuesday          Tue 10:00 ET
#   report-tuesday-waivers  Tue 11:00 ET
#   report-wednesday        Wed 10:00 ET
#   report-thursday         Thu 11:00 ET
#   report-friday           Fri 11:00 ET
#   report-saturday         Sat 10:00 ET
#   report-sunday           Sun 11:30 ET
#
# each after that day's nflverse/odds exports and after espn-daily's 09:08
# ET pull, all of which some report here reads.
#
# That ordering is no longer what makes the ESPN half correct. `cmd_report`
# refreshes ESPN's live views in-process before it builds, so the roster and
# transaction log a report reads are this run's, not the last slot's. It has
# to be: on 2026-09-16 report-wednesday fired on time while espn-wednesday
# had not run at all and the report rendered pre-waiver data as fact, and on
# 2026-09-17 the Thursday report listed a player traded away the previous
# afternoon -- a slot ordering cannot fix the second one at all, because a
# trade at 10:00 beats an 09:08 pull no matter how the slots are arranged.
#
# The nflverse/odds halves are still ordering-dependent, and every report
# still gates on its own inputs' freshness rather than trusting the slot
# order -- see espn_ff/report/waivers.py's waiver_read_is_settled and
# espn_ff/report/loaders.py's roster_read_is_current.
# See docs/aws-scheduling.md.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Which day's report to render"
        type: choice
        options: [monday, tuesday, tuesday-waivers, wednesday, thursday, friday, saturday, sunday]
        required: true

permissions:
  id-token: write
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'rahulAgrBej/espn-fantasy-football-sandbox'
    runs-on: ubuntu-latest
    environment: gh_env
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Mirrors nflverse.yml's/odds.yml's guard against an empty dispatch
      # input running as a bare, dayless `report`.
      - name: Resolve the day for this trigger
        id: pick
        run: |
          day="${{ inputs.day }}"
          if [ -z "$day" ]; then
            echo "::error::No day named on this dispatch -- refusing to run." \
                 "The caller must send one of: monday, tuesday, tuesday-waivers, wednesday, thursday, friday, saturday, sunday"
            exit 1
          fi
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "Resolved day: $day"

      # data/out/ is never covered by state-paths -- these reports read
      # matchups/weekly-rosters/player-pool/roster-slots/teams/transactions
      # exports that only exist in S3 under latest/out/, seeded here via
      # restore-out-datasets, and tuesday-waivers additionally reads
      # data/odds/ via state-paths' `odds` subtree.
      #
      # `espn` is restored but never pushed, and it is not optional.
      # cmd_report's own ESPN refresh runs an export, and
      # cli.py's _export_transactions merges the pull into the cumulative
      # store at data/espn/transactions.parquet before exporting the MERGED
      # frame. Without that store on disk the merge starts from empty and
      # writes a truncated transactions.csv that every report then reads --
      # exactly the failure espn_ff/espn_store.py exists to prevent. Not
      # pushing it back keeps espn.yml the sole writer of state/espn and
      # state/raw, so its --delete mirror stays safe; nothing is lost,
      # because mTransactions2 keeps returning the current scoring period's
      # rows and the next espn-daily run re-sees and durably stores anything
      # a report run pulled first, well before the Tue 03:00 ET rollover
      # that drops them.
      #
      # Restoring the union unconditionally (rather than per-day) is
      # deliberate: a missing dataset does not fail the run, it degrades the
      # report while still exiting 0 -- so a per-day list is a silent-failure
      # surface, not an optimisation. `push-paths` stays empty: this workflow
      # only reads `odds`, odds.yml remains its sole writer, and no
      # `--delete` race appears.
      - uses: ./.github/actions/ff-run
        with:
          command: "report --day ${{ steps.pick.outputs.day }}"
          state-paths: "raw espn sleeper nflverse raw/nflverse odds"
          restore-out-datasets: "matchups weekly-rosters player-pool roster-slots teams transactions"
          push-paths: ""
          # This job produces no data/out/ export -- it only restores them.
          # cmd_restore_out re-stamps each restored file with today's date,
          # so leaving archiving on made a read-only render copy yesterday's
          # data into today's archive slot and back over latest/out/. That is
          # why archive/out/transactions/2026-09-15.csv and -16.csv were
          # byte-identical (Observed 2026-09-16), and why the archive could
          # not serve as a recovery path for the week-1 history it should
          # have held. `push-paths: ""` already declares this job owns
          # nothing; archiving must respect that.
          archive: "false"
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          espn-s2: ${{ secrets.ESPN_S2 }}
          swid: ${{ secrets.SWID }}

      # Tolerates "nothing changed" (e.g. a same-day retry) without failing
      # the job -- there is no new content to commit, not an error.
      - name: Commit the rendered report
        run: |
          if git status --porcelain reports/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add reports/
            git commit -m "add ${{ steps.pick.outputs.day }} report"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "::notice::No new report content to commit"
          fi

      # Runs even if the commit above found nothing new, or lost a push
      # race against a concurrent human push -- best effort, matching
      # ff-run's own always()-gated persistence steps. No separate
      # configure-aws-credentials call is needed: the OIDC session ff-run
      # assumed persists as environment variables for the rest of the job.
      - name: Mirror reports/ to S3
        if: always()
        shell: bash
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: ./scripts/s3_sync.sh sync-reports

      # Append-only, not a mirror -- reports-json/ is gitignored, so
      # actions/checkout restores none of it and this tree holds only what
      # this run rendered. A --delete sync from here would wipe the season.
      - name: Mirror reports-json/ to S3
        if: always()
        shell: bash
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: ./scripts/s3_sync.sh sync-reports-json
