name: odds

# The only metered feed in this pipeline. Unlike every ESPN/Sleeper/nflverse
# command, re-running one of these spends real credits even when nothing
# about the market changed -- 500 per billing period, no historical
# endpoint, no way to buy a number back. See docs/odds-budget.md.
#
# All five jobs live in one workflow so they share a single concurrency
# group. The credit ledger is SQLite and its BEGIN IMMEDIATE atomicity only
# holds within one filesystem; two runners each with their own restored copy
# would both pass the guard. Serializing here is what makes the
# restore -> guard -> push cycle safe.
#
# The clock lives in AWS. EventBridge Scheduler dispatches all five jobs and
# names each one explicitly in `job`: Tue 09:38 slate, Thu 10:08 props, Fri
# 10:08 line_movement, Sun 10:38 pre_lock (critical -- unbackfillable), Mon
# 09:38 results, all ET. Those schedules alone do not auto-retry: EventBridge
# delivers at least once, and a duplicate pre_lock would spend real credits.
# See docs/aws-scheduling.md.
#
# The Monday and Tuesday slots sit 30 minutes after espn.yml's: these jobs
# read the ESPN cache (for the current week and roster) but espn.yml owns
# it, so they go second and never push it back. That 30-minute gap is the
# invariant and must be preserved if either side is ever retimed.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [slate, props, line_movement, pre_lock, results]
        required: true
      dry_run:
        description: "Estimate the cost and issue nothing"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: odds-ledger
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'rahulAgrBej/espn-fantasy-football-sandbox'
    runs-on: ubuntu-latest
    environment: gh_env
    steps:
      - uses: actions/checkout@v7

      # The caller names the job. This used to switch on the literal cron
      # string of the firing schedule, which coupled two files together: a
      # cron retimed in on.schedule but not in the case block silently
      # resolved to nothing. AWS now sends `job` as an explicit input, so
      # there is no string to keep in sync -- only the guard, which stays
      # because a dispatch with an empty input must never run as `odds `.
      - name: Resolve the job for this trigger
        id: pick
        run: |
          job="${{ inputs.job }}"
          if [ -z "$job" ]; then
            echo "::error::No job named on this dispatch -- refusing to run." \
                 "The caller must send one of: slate props line_movement pre_lock results."
            exit 1
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "Resolved job: $job"

      # Nothing in the code stops `odds slate` from spending credits in
      # April. The season runs Sep-Jan; outside it there is no slate to
      # price and every request would be pure waste.
      - name: Off-season guard
        id: season
        run: |
          month=$(date -u +%m)
          case "$month" in
            09|10|11|12|01) echo "in_season=true"  >> "$GITHUB_OUTPUT" ;;
            *)              echo "in_season=false" >> "$GITHUB_OUTPUT"
                            echo "::notice::Off-season (month $month) -- skipping, no credits spent" ;;
          esac

      # --dry-run walks the same event selection the real job would and
      # prints the estimate using only the free /events endpoint. It is the
      # inverse of a bypass flag: it can only decline to spend.
      - name: Preflight cost estimate
        if: steps.season.outputs.in_season == 'true'
        continue-on-error: true
        uses: ./.github/actions/ff-run
        with:
          command: "odds ${{ steps.pick.outputs.job }} --dry-run"
          archive: "false"
          push-paths: "odds"
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          espn-s2: ${{ secrets.ESPN_S2 }}
          swid: ${{ secrets.SWID }}
          odds-api-key: ${{ secrets.ODDS_API_KEY }}
          odds-quota-reset-day: ${{ vars.ODDS_QUOTA_RESET_DAY }}

      # projections is free and offline -- it only reads what the job above
      # captured -- so it runs in the same invocation.
      #
      # dry_run defaults to TRUE, so this step is opt-in. That default is
      # right for a human clicking "Run workflow" by hand and dangerous for an
      # automated caller: a dispatch that omits dry_run skips this step and
      # reports success having collected nothing. Every AWS schedule therefore
      # sends dry_run:"false" explicitly (infra/scheduler.yaml, OddsRule), and
      # the step below makes a skip visible rather than silent.
      - name: Run the metered job
        if: >-
          steps.season.outputs.in_season == 'true' &&
          inputs.dry_run != true
        uses: ./.github/actions/ff-run
        with:
          command: |
            odds ${{ steps.pick.outputs.job }}
            projections
          # data/raw is read-only here -- espn.yml owns it, and on Monday and
          # Tuesday both workflows are scheduled within the hour.
          state-paths: "odds raw raw/odds"
          push-paths: "odds raw/odds"
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          espn-s2: ${{ secrets.ESPN_S2 }}
          swid: ${{ secrets.SWID }}
          odds-api-key: ${{ secrets.ODDS_API_KEY }}
          odds-quota-reset-day: ${{ vars.ODDS_QUOTA_RESET_DAY }}

      # A skipped metered step and a clean run are otherwise indistinguishable
      # in the run list -- both are green. Say so out loud.
      - name: Note that nothing was collected
        if: >-
          steps.season.outputs.in_season == 'true' &&
          inputs.dry_run == true
        run: |
          echo "::warning::dry_run was true -- estimated only, no odds collected" \
               "and no credits spent. An automated caller must send dry_run=false."

      - name: Report remaining credits
        if: always() && steps.season.outputs.in_season == 'true'
        uses: ./.github/actions/ff-run
        with:
          command: "credits"
          archive: "false"
          push-paths: "odds"
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
