name: espn

# Weekly close-the-book pulls plus Sunday live scoring.
#
# --refresh is required on every slot, not optional. cmd_export fetches
# ["mMatchupScore", "mTeam"] with no ttl, so matchups.csv -- and with it
# points_live and winner -- is cached forever once written. Without
# --refresh a Sunday run would keep reporting 0.0 / UNDECIDED for games
# that already finished. See docs/data-sources.md's ESPN section.
# The clock lives in AWS, not here. EventBridge Scheduler dispatches Mon and
# Tue 09:08 ET, and the Sunday live-scoring grid every 30 minutes from 13:08
# ET through 00:38 ET Monday. Sunday in-progress scoring cannot be backfilled,
# so a dropped trigger is a permanent hole -- which is why GitHub's scheduler
# is no longer trusted with it. See docs/aws-scheduling.md.
#
# The Mon/Tue slots sit 30 minutes ahead of odds.yml's on purpose: the odds
# jobs read the ESPN cache this workflow owns and must go second. Preserve
# that gap if either side is ever retimed.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Sunday slots fire every 30 minutes; a slow run must not overlap the next.
concurrency:
  group: espn
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'rahulAgrBej/espn-fantasy-football-sandbox'
    runs-on: ubuntu-latest
    environment: gh_env
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ff-run
        with:
          command: |
            pull --refresh
            export --refresh
          state-paths: "raw"
          push-paths: "raw"
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          espn-s2: ${{ secrets.ESPN_S2 }}
          swid: ${{ secrets.SWID }}
