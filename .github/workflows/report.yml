name: report

# Renders one of docs/report-weekly-schedule.md's reports from data already
# on disk and commits the result to reports/, mirroring it to S3 as well.
# `monday`, `tuesday`, `tuesday-waivers`, `wednesday` and `thursday` are
# implemented (espn_ff/cli.py's REPORTS) -- the workflow forwards whatever
# `day` AWS sends and lets cmd_report's own "not implemented" guard handle
# the rest, so a future report day needs no new workflow file, just a wider
# `options:` list below plus a new schedule.
#
# Unlike every other workflow here, this one writes back to the repo, not
# just to S3 -- reports/<season>/week-NN/ is git-tracked and this job needs
# contents: write to commit its own output.
#
# The clock lives in AWS. EventBridge Scheduler dispatches:
#
#   report-monday           Mon 10:30 ET
#   report-tuesday          Tue 10:00 ET
#   report-tuesday-waivers  Tue 11:00 ET
#   report-wednesday        Wed 10:00 ET
#   report-thursday         Thu 11:00 ET
#
# each after that day's ESPN/nflverse/odds exports, all of which some report
# here reads. That ordering is an assumption this workflow cannot enforce --
# it never fetches, it only restores what S3 already has. On 2026-09-16
# report-wednesday fired on time while espn-wednesday had not run at all, and
# the report rendered pre-waiver data as fact. The reports themselves now
# gate on their own inputs' freshness rather than trusting the slot order;
# see espn_ff/report/waivers.py's waiver_read_is_settled.
# See docs/aws-scheduling.md.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Which day's report to render"
        type: choice
        options: [monday, tuesday, tuesday-waivers, wednesday, thursday]
        required: true

permissions:
  id-token: write
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'rahulAgrBej/espn-fantasy-football-sandbox'
    runs-on: ubuntu-latest
    environment: gh_env
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Mirrors nflverse.yml's/odds.yml's guard against an empty dispatch
      # input running as a bare, dayless `report`.
      - name: Resolve the day for this trigger
        id: pick
        run: |
          day="${{ inputs.day }}"
          if [ -z "$day" ]; then
            echo "::error::No day named on this dispatch -- refusing to run." \
                 "The caller must send one of: monday, tuesday, tuesday-waivers, wednesday, thursday"
            exit 1
          fi
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "Resolved day: $day"

      # data/out/ is never covered by state-paths -- these reports read
      # matchups/weekly-rosters/player-pool/roster-slots/teams/transactions
      # exports that only exist in S3 under latest/out/, seeded here via
      # restore-out-datasets, and tuesday-waivers additionally reads
      # data/odds/ via state-paths' `odds` subtree.
      #
      # Restoring the union unconditionally (rather than per-day) is
      # deliberate: a missing dataset does not fail the run, it degrades the
      # report while still exiting 0 -- so a per-day list is a silent-failure
      # surface, not an optimisation. `push-paths` stays empty: this workflow
      # only reads `odds`, odds.yml remains its sole writer, and no
      # `--delete` race appears.
      - uses: ./.github/actions/ff-run
        with:
          command: "report --day ${{ steps.pick.outputs.day }}"
          state-paths: "raw sleeper nflverse raw/nflverse odds"
          restore-out-datasets: "matchups weekly-rosters player-pool roster-slots teams transactions"
          push-paths: ""
          # This job produces no data/out/ export -- it only restores them.
          # cmd_restore_out re-stamps each restored file with today's date,
          # so leaving archiving on made a read-only render copy yesterday's
          # data into today's archive slot and back over latest/out/. That is
          # why archive/out/transactions/2026-09-15.csv and -16.csv were
          # byte-identical (Observed 2026-09-16), and why the archive could
          # not serve as a recovery path for the week-1 history it should
          # have held. `push-paths: ""` already declares this job owns
          # nothing; archiving must respect that.
          archive: "false"
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          espn-s2: ${{ secrets.ESPN_S2 }}
          swid: ${{ secrets.SWID }}

      # Tolerates "nothing changed" (e.g. a same-day retry) without failing
      # the job -- there is no new content to commit, not an error.
      - name: Commit the rendered report
        run: |
          if git status --porcelain reports/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add reports/
            git commit -m "add ${{ steps.pick.outputs.day }} report"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "::notice::No new report content to commit"
          fi

      # Runs even if the commit above found nothing new, or lost a push
      # race against a concurrent human push -- best effort, matching
      # ff-run's own always()-gated persistence steps. No separate
      # configure-aws-credentials call is needed: the OIDC session ff-run
      # assumed persists as environment variables for the rest of the job.
      - name: Mirror reports/ to S3
        if: always()
        shell: bash
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: ./scripts/s3_sync.sh sync-reports
