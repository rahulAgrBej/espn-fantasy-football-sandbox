name: espn

# Weekly close-the-book pulls plus Sunday live scoring.
#
# --refresh is kept on every slot as belt-and-suspenders, not because it's
# the only thing standing between this and stale data. cmd_export's
# ["mMatchupScore", "mTeam"] fetch (matchups.csv -- points_live, winner) now
# carries a real 300s ttl (ttl_for(None, current)), so it refreshes on its
# own well within the 30-minute Sunday cadence below even without
# --refresh. --refresh just forces it immediately rather than waiting up to
# 300s. See docs/data-sources.md's ESPN section, "Freshness mechanism".
# The clock lives in AWS, not here. This workflow's header is the only
# in-repo record of a schedule that lives in EventBridge, so keep this list
# complete -- an ESPN slot that exists nowhere in the repo is how the
# 2026-09-16 waiver gap went unnoticed. Five rules dispatch this workflow:
#
#   espn-monday         Mon 09:08 ET
#   espn-tuesday        Tue 09:08 ET
#   espn-wednesday      Wed 09:08 ET   -- waiver settlements from Tue night
#   espn-monday-night   Mon 00:08 and 00:38 ET
#   espn-sunday-live    Sun 13:08 ET -> Mon 00:38 ET, every 30 minutes
#
# Sunday in-progress scoring cannot be backfilled, so a dropped trigger is a
# permanent hole -- which is why GitHub's scheduler is no longer trusted with
# it. See docs/aws-scheduling.md.
#
# The Mon/Tue/Wed slots sit 30 minutes ahead of odds.yml's and ~52 minutes
# ahead of the report slots on purpose: the odds jobs read the ESPN cache
# this workflow owns and must go second, and a report rendering before its
# day's pull lands reads pre-settlement data. Preserve those gaps if either
# side is ever retimed.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Sunday slots fire every 30 minutes; a slow run must not overlap the next.
concurrency:
  group: espn
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'rahulAgrBej/espn-fantasy-football-sandbox'
    runs-on: ubuntu-latest
    environment: gh_env
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ff-run
        with:
          command: |
            pull --refresh
            export --refresh
          # `espn` carries the cumulative transaction store. espn.yml is its
          # sole writer, which is what makes push-state's --delete safe here.
          # It must be restored as well as pushed: merging into an empty
          # store would publish a truncated export, which is the failure the
          # store exists to prevent.
          state-paths: "raw espn"
          push-paths: "raw espn"
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          espn-s2: ${{ secrets.ESPN_S2 }}
          swid: ${{ secrets.SWID }}
