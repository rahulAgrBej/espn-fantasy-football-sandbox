          DetailType: dispatch.summary
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt DispatchDlq.Arn

# ---------------------------------------------------------------------------

Outputs:

  BusName:
    Description: Event bus to publish test dispatches to
    Value: !Ref DispatchBus

  BusArn:
    Value: !GetAtt DispatchBus.Arn

  ConnectionName:
    Description: Pass to `aws events update-connection` when rotating the PAT
    Value: !Ref GitHubConnection

  DlqUrl:
    Description: Failed dispatches land here; a message means a slot did not run
    Value: !Ref DispatchDlq

  AlarmTopicArn:
    Value: !Ref AlarmTopic
