name: nflverse

# nflverse rebuilds its release assets several times a day, so the routine
# slots are just "check again" -- both commands are idempotent and a run
# against an unchanged timestamp downloads nothing at all (the manifest's
# ETags turn it into a 304).
#
# The clock lives in AWS. EventBridge Scheduler dispatches the routine slots
# at 09:23 / 13:23 / 18:23 ET with force=false, and the Thursday canonical
# read at 09:53 ET with force=true. See docs/aws-scheduling.md.
#
# The two Thursday slots stay 30 minutes apart. They once shared 13:00, which
# meant GitHub fired both at the same minute -- one forced, one not -- and the
# concurrency group serialized them in no guaranteed order, so which run's
# data survived was a coin flip. Two schedules carrying an explicit `force`
# input now make that collision structurally impossible, but the ordering
# still matters: the routine slot runs first so the forced canonical read is
# deterministically the one that lands.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the timestamp short-circuit (--force)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: nflverse
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'rahulAgrBej/espn-fantasy-football-sandbox'
    runs-on: ubuntu-latest
    environment: gh_env
    steps:
      - uses: actions/checkout@v7

      # Stat corrections land Tue/Wed, so Thursday is the first pull where
      # `provisional` reliably resolves to false for last week's games.
      # That one slot forces a full re-download; the rest stay cheap.
      #
      # The trigger no longer decides this -- the caller does. AWS sends
      # force=true only on the Thursday 09:53 ET schedule.
      - name: Pick the refresh mode
        id: mode
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "flag=--force" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/ff-run
        with:
          command: |
            nflverse ${{ steps.mode.outputs.flag }}
            features
          state-paths: "nflverse raw raw/nflverse"
          push-paths: "nflverse raw/nflverse"
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          # cmd_nflverse resolves the current week and fetches the roster to
          # assert every rostered player resolves through the id crosswalk,
          # so this job needs ESPN credentials despite being an nflverse pull.
          espn-s2: ${{ secrets.ESPN_S2 }}
          swid: ${{ secrets.SWID }}
