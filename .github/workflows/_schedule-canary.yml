name: _schedule-canary

# Temporary. Delete once the question below is answered.
#
# Every cron in this repo is at :00 or :30, and as of 2026-09-15 14:40Z not one
# `schedule` event had ever been delivered -- five slots were due between the
# workflows registering (04:08Z) and then, and all five were missed. The
# collection workflows only fire once or twice a day, so waiting on them to
# tell us anything takes days.
#
# This fires every 30 minutes on an off-peak minute instead, which separates
# three explanations that the once-a-day slots cannot:
#
#   canary fires, collection fires  -> the schedules just took a while to
#                                      register; nothing is wrong.
#   canary fires, collection does not -> :00/:30 congestion, or something
#                                      specific to those five files.
#   canary never fires              -> the scheduler is not delivering to this
#                                      repository at all; escalate, and cite
#                                      this workflow as the evidence.
#
# Deliberately declares no environment, no id-token, and no secrets: it must be
# incapable of failing for any reason other than not being scheduled. There is
# precedent for a throwaway workflow like this -- _oidc-debug.yml was added and
# removed the same night (79816ec, 0c286cd).
on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    # Never inherited by a fork.
    if: github.repository == 'rahulAgrBej/espn-fantasy-football-sandbox'
    runs-on: ubuntu-latest
    steps:
      # No checkout: the point is to record that GitHub started the run at all,
      # so the job does the least work that still produces a timestamp. Compare
      # this against the run's own created_at (`gh run list --json createdAt`)
      # to measure the delay -- a run created well after its scheduled minute is
      # congestion, which is the same thing that drops the real slots.
      - name: Tick
        run: |
          echo "::notice::canary fired -- event=${{ github.event_name }} cron='${{ github.event.schedule }}' now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
