[project]
name = "espn-ff"
version = "0.1.0"
description = "Retrieve and tidy data from ESPN's fantasy football API"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "duckdb>=1.1",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["espn_ff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the live ESPN API; needs ESPN_S2/SWID",
    "odds_live: spends real credits",
]
