name: _oidc-debug
on: { workflow_dispatch: }
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    environment: gh_env
    steps:
      - name: Print only the sub and aud claims
        run: |
          # The token itself is a credential and is never printed; sub/aud are
          # identifiers and are exactly what the IAM trust policy matches on.
          tok=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(echo "$tok" | cut -d. -f2)
          pad=$(( (4 - ${#payload} % 4) % 4 )); payload="$payload$(printf '=%.0s' $(seq 1 $pad))"
          echo "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, environment, ref, workflow_ref}'
