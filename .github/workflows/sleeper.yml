name: sleeper

# Daily player-status snapshot. This is the workflow that matters most for
# continuity: practice_trajectory (Wed/Thu/Fri) and the depth-chart deltas
# are reconstructed from OUR OWN daily snapshots, not fetched. A missed day
# is a permanent hole -- Sleeper publishes no history to backfill from.
#
# Because a missed day cannot be recovered, this is the workflow with the most
# to lose from a dropped trigger -- which is what GitHub's scheduler did here.
# The 08:11 ET slot is now dispatched by EventBridge Scheduler, pinned to
# America/New_York so it holds 08:11 ET across the DST boundary rather than
# sliding to 07:11. See docs/aws-scheduling.md and infra/scheduler.yaml.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: sleeper
  cancel-in-progress: false

jobs:
  collect:
    # Never inherited by a fork.
    if: github.repository == 'rahulAgrBej/espn-fantasy-football-sandbox'
    runs-on: ubuntu-latest
    environment: gh_env
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ff-run
        with:
          # No --refresh here, ever. It is one global flag with two effects:
          # it bypasses the ESPN cache AND fetch_players' once-a-day
          # short-circuit, which would breach Sleeper's documented ask that
          # /v1/players/nfl be called at most once a day.
          command: |
            sleeper
            status
          # Reads data/raw for the ESPN player pool and current week, but only
          # data/sleeper is ours to mirror back.
          state-paths: "sleeper raw raw/sleeper"
          push-paths: "sleeper raw/sleeper"
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          espn-s2: ${{ secrets.ESPN_S2 }}
          swid: ${{ secrets.SWID }}
